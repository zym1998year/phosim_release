name: Windows CI

on:
  push:
    branches: [windows-msvc-port]
  pull_request:
    branches: [windows-msvc-port]

defaults:
  run:
    shell: bash -el {0}

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The GitHub mirror omits files >100 MB (GitHub hard limit). Fetch the ones the
      # smoke test needs from the Bitbucket upstream at the recorded v6.3 baseline.
      # On a full checkout the files already exist and this step is a no-op.
      - name: Fetch large data files if missing
        run: |
          base="099a9c1c62756bb63fd238328e73aa041366b091"
          for f in data/atmosphere/wind.txt data/atmosphere/artificial.txt; do
            if [ ! -f "$f" ]; then
              echo "fetching $f from Bitbucket upstream"
              curl -fsSL --retry 3 -o "$f" "https://bitbucket.org/phosim/phosim_release/raw/$base/$f"
            fi
          done

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: phosim-build
          python-version: "3.11"

      # Call conda.exe directly: invoking the `mamba`/`conda` .bat wrappers from Git
      # Bash silently swallowed the command (cmd.exe banner, exit 0, nothing installed).
      - name: Install dependencies
        run: |
          "$CONDA/Scripts/conda.exe" install -y -n phosim-build cfitsio=4.4.0 fftw=3.3.10 zlib python=3.11 cmake ninja
          "$CONDA/Scripts/conda.exe" list -n phosim-build | grep -E '^(cfitsio|fftw|zlib|cmake|ninja|python) '

      # Conda activation inside `bash -el` proved unreliable after msvc-dev-cmd rewrote
      # the job PATH (CONDA_PREFIX was empty at Configure time on the first run). Resolve
      # the env prefix explicitly from the runner-provided $CONDA and export it for all
      # later steps, instead of depending on the activation hook.
      - name: Expose conda env prefix
        run: |
          PREFIX_M="$(cygpath -m "$("$CONDA/Scripts/conda.exe" info --base)")/envs/phosim-build"
          echo "CONDA_ENV_PREFIX=$PREFIX_M" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$PREFIX_M")" >> "$GITHUB_PATH"
          echo "$(cygpath -w "$PREFIX_M/Library/bin")" >> "$GITHUB_PATH"
          echo "$(cygpath -w "$PREFIX_M/Scripts")" >> "$GITHUB_PATH"
          ls "$PREFIX_M/Library/include/fitsio.h" "$PREFIX_M/Library/bin/cmake.exe"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CONDA_ENV_PREFIX/Library"

      - name: Build
        run: cmake --build build --parallel

      - name: CTest
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Smoke test - examples/star (single process)
        run: python phosim.py examples/star -c examples/nobackground -p 1 -t 1

      - name: Assert FITS output produced
        run: |
          shopt -s nullglob
          fits_files=(output/*.fits.gz output/*.fits)
          if [ ${#fits_files[@]} -eq 0 ]; then
            echo "No FITS output found in output/" >&2
            exit 1
          fi
          echo "Found FITS output:"
          printf '%s\n' "${fits_files[@]}"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-failure-artifacts
          path: |
            output/
            build/CMakeCache.txt
            build/Testing/Temporary/LastTest.log
            work/*.pars
          if-no-files-found: ignore
          retention-days: 14
